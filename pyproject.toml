[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchlens"
version = "1.2.0"
description = "Intelligent Research Paper Search and Discovery System — IT4868E"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2,<3", "scipy>=1.15,<2", "scikit-learn>=1.6,<2", "networkx>=3.4,<4", "httpx>=0.28,<1", "pydantic>=2.10,<3", "matplotlib>=3.10,<4", "joblib>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "playwright>=1.56,<2"]

[tool.hatch.build.targets.wheel]
packages = ["researchlens"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
